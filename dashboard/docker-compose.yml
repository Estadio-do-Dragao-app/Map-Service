version: '3.8'

services:
  dashboard-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dashboard-backend
    ports:
      - "8015:8000"   # Host 8015 -> container 8000 (evita conflito com outros servicos)
    environment:
      MAP_SERVICE_URL: http://host.docker.internal:8000
      # Must match the API_KEY used by the Map-Service, otherwise calls are rejected (401)
      API_KEY: ${API_KEY:-dragao_secret_key_2026}
    # Para Linux, é necessário adicionar isto para que host.docker.internal funcione:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  dashboard-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite inlines this at BUILD time into the JS bundle. Default '/api' makes the
        # browser hit nginx, which proxies to dashboard-backend (see nginx.conf).
        VITE_DASHBOARD_API_BASE: ${VITE_DASHBOARD_API_BASE:-/api}
    container_name: dashboard-frontend
    ports:
      - "8016:8080"   # Host 8016 -> container 8080 (nginx unprivileged port)
    depends_on:
      - dashboard-backend
    restart: unless-stopped
